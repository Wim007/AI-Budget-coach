# Docker Compose v2 — geen 'version:' key (deprecated)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-in-production}
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Wordt ingebakken bij de build — moet de publiek bereikbare backend-URL zijn
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_data:
